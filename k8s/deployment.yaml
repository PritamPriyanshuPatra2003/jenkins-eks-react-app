apiVersion: apps/v1
kind : Deployment

metadata :
  name : react-deployment
   


spec :
  replicas : 3


  selector :
    matchLabels :
      app: react

 
  template :
    metadata :
      labels :
        app: react


    spec :
      containers :
        - name: react-container
          image :  245594728226.dkr.ecr.ap-south-1.amazonaws.com/jenkins-eks-react-app:2.1
          imagePullPolicy : IfNotPresent
          ports :
            - containerPort: 80

          envFrom:
             - configMapRef:
                   name: react-config

