<svg width="680" height="550" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Jenkins CI/CD to Amazon EKS architecture</title>
<desc>Flow from Git repository through Jenkins pipeline, Docker build and ECR push, into an Amazon EKS cluster containing worker nodes, a deployment, and a service, ending with the application accessible in the browser.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="550" fill="#ffffff"/>

<line x1="340" y1="76" x2="340" y2="110" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="166" x2="340" y2="200" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="256" x2="340" y2="290" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="432" x2="340" y2="466" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390" y1="384" x2="405" y2="384" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="20" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Git repository</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Developer pushes code</text>
</g>

<g>
<rect x="220" y="110" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Jenkins pipeline</text>
<text x="340" y="146" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">Builds and orchestrates CI/CD</text>
</g>

<g>
<rect x="220" y="200" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Build &amp; push image</text>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">Docker image to Amazon ECR</text>
</g>

<g>
<rect x="140" y="290" width="400" height="142" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#042C53">Amazon EKS cluster</text>
<text x="340" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Managed Kubernetes control plane</text>
</g>

<g>
<rect x="175" y="356" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="225" y="374" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">Nodes</text>
