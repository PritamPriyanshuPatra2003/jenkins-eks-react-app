<text x="340" y="392" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">App pods</text>
</g>

<g>
<rect x="405" y="356" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
